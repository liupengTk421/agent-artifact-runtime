name: Replay Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: replay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "pnpm-lock.yaml not found, using --no-frozen-lockfile"
            pnpm install --no-frozen-lockfile
          fi

      - name: Validate example state
        run: pnpm artifact validate examples/image-feedback/artifact.state.json

      - name: Replay example event log
        run: pnpm --filter @agent-artifact-runtime/cli artifact replay --state examples/image-feedback/initial.state.json --events examples/image-feedback/events.jsonl
