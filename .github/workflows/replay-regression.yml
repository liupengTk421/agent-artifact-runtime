name: Replay Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install
      - run: pnpm --filter @agent-artifact-runtime/cli artifact replay --state examples/image-feedback/initial.state.json --events examples/image-feedback/events.jsonl
